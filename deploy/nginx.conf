# Grimório — site no nginx (Ubuntu).
# Copie para /etc/nginx/sites-available/grimorio, ajuste server_name e root,
# depois:  sudo ln -s /etc/nginx/sites-available/grimorio /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# HTTPS:   sudo certbot --nginx -d rpg.seudominio.com.br

server {
    listen 80;
    server_name rpg.seudominio.com.br;

    # build do front (npm run build em front/)
    root /var/www/grimorio/front/dist;
    index index.html;

    # upload de imagens do mestre (o back aceita até 15 MB)
    client_max_body_size 16m;

    # API (NestJS no pm2)
    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Tempo real (Socket.IO) — precisa dos headers de upgrade do WebSocket
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # mesa aberta por horas: não derrubar a conexão ociosa
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # JS/CSS com hash no nome: cache longo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: qualquer outra rota cai no index.html (o Vue Router resolve)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
